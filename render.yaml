# Render Blueprint — API + Telegram approval gate
# https://dashboard.render.com → New → Blueprint
#
# After deploy, set FRONTEND_URL to your Vercel URL and update Meta OAuth redirect:
#   https://<this-service>.onrender.com/api/integrations/facebook/callback

services:
  - type: web
    name: marketing-agent-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_ID
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SKIP_NOTEBOOKLM
        value: "1"
      - key: NOTEBOOKLM_VIDEO_FORMAT
        value: short
